[package]
name = "jarness-executor"
version = "0.1.0"
edition = "2021"
description = "Jarness local executor: performs file and process work outside the daemon JVM"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
regex = "1"
glob = "0.3"

[profile.release]
strip = true
lto = "thin"
